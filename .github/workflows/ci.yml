name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client from the checked-out schema
        run: npm run db:generate

      - name: Run unit and integration-runner safety tests
        run: npm test

      # The runner starts only the disposable PostgreSQL 17 test service,
      # deploys and checks migrations, runs integration tests, and stops it.
      - name: Run real PostgreSQL integration tests
        run: npm run test:integration

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production application
        run: npm run build
